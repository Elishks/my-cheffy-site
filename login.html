<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="utf-8">
    <title>Авторизация – MasterChef</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="cheffy-top-bar">
    <span>Cheffy – Твой кулинарный помощник</span>
</div>
    <nav class="main-nav">
        <a href="index.html">Поиск</a>
        <a href="catalog.html">Каталог</a>
        <a href="login.html" class="active">Войти</a>
        <a href="profile.html">Профиль (Моя Кладовая)</a>
        <a href="add-recipe.html">Добавить рецепт</a>
        <a href="blog.html">Блог/Советы</a>
    </nav>

    <div class="auth-container">
        <button type="button" id="auth-toggle-btn" class="auth-corner-btn" onclick="toggleAuthMode()">Регистрация</button>

        <h2 id="auth-title" class="auth-main-title">Вход в систему</h2>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="auth-field-group">
                <label for="auth-email">E-mail</label>
                <input type="email" id="auth-email" placeholder="chef@example.com" required>
            </div>

            <div class="auth-field-group">
                <label for="auth-password">Пароль</label>
                <input type="password" id="auth-password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="auth-submit-btn" class="main-search-btn auth-submit-wide">Войти</button>
        </form>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <p>© 2026 Разработка поисковой системы рецептов. Студент Ульянова Элина 251-333.</p>
            <p>Контакты техподдержки: <a href="mailto:support@cheffy.ru">support@masterchef.ru</a> | Тел: +7 (999) 123-45-67</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
